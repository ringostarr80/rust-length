name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose

  codecov:
    name: Code coverage

    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read  # Required by actions/checkout to read the repository

    container:
      image: xd009642/tarpaulin:0.34.0@sha256:195720a634b99ac8bfd4706b19e21a790236128cd93b1713bed3a356875f0b0d
      options: --security-opt seccomp=unconfined

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Build
      run: cargo build --locked --verbose
    - name: Generate code coverage
      run: cargo tarpaulin --locked --out Xml
    - name: Upload to codecov.io
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./cobertura.xml
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
